<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文章 - 个人博客</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="/js/common.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">✨ 我的博客</a>
        <ul class="navbar-nav">
            <li><a href="/">首页</a></li>
            <li><a href="/user/profile">👤 个人主页</a></li>
            <li><a href="/article/publish" class="btn btn-primary btn-sm">✏️ 写文章</a></li>
            <li><button class="btn btn-ghost btn-sm" onclick="userState.logout()">退出</button></li>
        </ul>
    </div>
</nav>

<main class="container my-4" id="app">
    <!-- Loading -->
    <div v-if="loading" style="padding:40px 0">
        <div class="skeleton" style="height:36px;width:50%;margin-bottom:16px"></div>
        <div class="skeleton skeleton-text" v-for="i in 4"></div>
    </div>

    <template v-if="!loading">
        <h2 style="margin-bottom:24px">✏️ 编辑文章</h2>

        <form @submit.prevent="submitEdit">
            <!-- Cover Upload -->
            <div class="form-group">
                <label class="form-label">封面图片 <span class="text-muted">(可选)</span></label>
                <div class="upload-area" @click="$refs.fileInput.click()" @dragover.prevent @dragenter="dragOver=true" @dragleave="dragOver=false" @drop.prevent="handleDrop" :class="{'drag-over': dragOver}">
                    <div v-if="!coverPreview && !form.coverImage">
                        <div class="upload-icon">📷</div>
                        <p style="color:var(--text-secondary)">点击或拖拽更换封面图</p>
                    </div>
                    <img v-if="coverPreview" class="upload-preview" :src="coverPreview" alt="预览">
                    <img v-if="!coverPreview && form.coverImage" class="upload-preview" :src="form.coverImage" alt="封面">
                </div>
                <input type="file" ref="fileInput" hidden accept="image/*" @change="handleFileSelect">
            </div>

            <div class="form-group">
                <label class="form-label" for="title">标题</label>
                <input type="text" id="title" class="form-input" v-model="form.title" style="font-size:1.2rem;font-weight:600" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="summary">摘要</label>
                <input type="text" id="summary" class="form-input" v-model="form.summary">
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap">
                <div class="form-group" style="flex:1;min-width:200px">
                    <label class="form-label" for="categoryId">分类</label>
                    <select id="categoryId" class="form-input" v-model="form.categoryId">
                        <option value="">选择分类...</option>
                        <option v-for="cat in categories" :value="cat.id">{{ cat.name }}</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;min-width:200px">
                    <label class="form-label" for="status">状态</label>
                    <select id="status" class="form-input" v-model="form.status">
                        <option :value="1">📢 已发布</option>
                        <option :value="0">📝 草稿</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">标签 <span class="text-muted">(逗号分隔)</span></label>
                <input type="text" class="form-input" v-model="form.tags">
            </div>

            <div class="form-group">
                <label class="form-label">内容 <span class="text-muted">(Markdown)</span></label>
                <div class="editor-layout">
                    <div class="editor-pane">
                        <textarea class="form-input" v-model="form.content" style="min-height:450px;font-family:var(--font-mono);font-size:0.9rem;line-height:1.7" @input="updatePreview"></textarea>
                    </div>
                    <div class="preview-pane">
                        <h3 style="margin-bottom:12px;font-size:0.9rem;color:var(--text-muted)">📄 实时预览</h3>
                        <div class="article-content" v-html="previewHtml"></div>
                    </div>
                </div>
            </div>

            <div v-if="errorMsg" class="mb-2" style="color:var(--color-error)">{{ errorMsg }}</div>
            <div style="display:flex;gap:12px">
                <button type="submit" class="btn btn-primary btn-lg" :disabled="submitting">
                    {{ submitting ? '保存中...' : '💾 保存修改' }}
                </button>
                <a :href="'/article/detail/' + articleId" class="btn btn-secondary btn-lg">取消</a>
            </div>
        </form>
    </template>
</main>

<script>
const articleId = window.location.pathname.split('/').pop();
</script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
marked.setOptions({ breaks: true, gfm: true });
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const form = ref({ title: '', content: '', summary: '', categoryId: '', status: 1, coverImage: '', tags: '' });
        const categories = ref([]);
        const loading = ref(true);
        const coverFile = ref(null);
        const coverPreview = ref('');
        const dragOver = ref(false);
        const previewHtml = ref('');
        const errorMsg = ref('');
        const submitting = ref(false);

        const loadArticle = async () => {
            try {
                const res = await api.get(`/api/article/${articleId}`);
                if (res.code === 200 && res.data) {
                    const a = res.data;
                    form.value = {
                        title: a.title || '',
                        content: a.content || '',
                        summary: a.summary || '',
                        categoryId: a.categoryId || '',
                        status: a.status !== undefined ? a.status : 1,
                        coverImage: a.coverImage || '',
                        tags: a.tags || ''
                    };
                    updatePreview();
                } else {
                    showToast('加载文章失败', 'error');
                    setTimeout(() => { window.location.href = '/'; }, 1000);
                }
            } catch {
                showToast('网络错误', 'error');
            } finally {
                loading.value = false;
            }
        };

        const loadCategories = async () => {
            try {
                const res = await api.get('/api/category/list');
                if (res.code === 200) categories.value = res.data || [];
            } catch {}
        };

        const handleFileSelect = (e) => {
            const file = e.target.files[0];
            if (file) processFile(file);
        };

        const handleDrop = (e) => {
            dragOver.value = false;
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        };

        const processFile = (file) => {
            if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 'warning'); return; }
            coverFile.value = file;
            const reader = new FileReader();
            reader.onload = (e) => { coverPreview.value = e.target.result; };
            reader.readAsDataURL(file);
        };

        const uploadCover = async () => {
            if (!coverFile.value) return null;
            const formData = new FormData();
            formData.append('file', coverFile.value);
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/upload/image', {
                    method: 'POST',
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {},
                    body: formData
                });
                const data = await res.json();
                if (data.code === 200) return data.data.url;
            } catch {}
            return null;
        };

        const updatePreview = () => {
            previewHtml.value = form.value.content ? marked.parse(form.value.content) : '<p style="color:#94a3b8">预览...</p>';
        };

        const submitEdit = async () => {
            if (!form.value.title.trim() || !form.value.content.trim()) {
                errorMsg.value = '标题和内容不能为空';
                return;
            }
            submitting.value = true;
            errorMsg.value = '';
            try {
                let cover = form.value.coverImage;
                if (coverFile.value) {
                    const uploaded = await uploadCover();
                    if (uploaded) cover = uploaded;
                }
                const body = {
                    title: form.value.title,
                    content: form.value.content,
                    summary: form.value.summary,
                    categoryId: form.value.categoryId ? parseInt(form.value.categoryId) : null,
                    status: form.value.status,
                    coverImage: cover
                };
                const res = await api.put(`/api/article/${articleId}`, body);
                if (res.code === 200) {
                    showToast('保存成功！', 'success');
                } else {
                    errorMsg.value = res.msg || '保存失败';
                }
            } catch { errorMsg.value = '网络错误'; }
            finally { submitting.value = false; }
        };

        onMounted(() => {
            loadArticle();
            loadCategories();
        });

        return {
            form, categories, loading, coverPreview, dragOver, previewHtml,
            errorMsg, submitting, articleId,
            handleFileSelect, handleDrop, updatePreview, submitEdit
        };
    }
}).mount('#app');
</script>
</body>
</html>
