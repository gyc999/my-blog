<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布文章 - 个人博客</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="/js/common.js"></script>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">✨ 郭源潮的个人博客</a>
        <ul class="navbar-nav">
            <li><a href="/">首页</a></li>
            <li><a href="/user/profile">👤 个人主页</a></li>
            <li><a href="/article/publish" class="btn btn-primary btn-sm">✏️ 写文章</a></li>
            <li><button class="btn btn-ghost btn-sm" onclick="userState.logout()">退出</button></li>
        </ul>
    </div>
</nav>

<main class="container my-4" id="app">
    <h2 style="margin-bottom:24px">✏️ 发布新文章</h2>

    <form @submit.prevent="submitArticle">
        <!-- Cover Upload -->
        <div class="form-group">
            <label class="form-label">封面图片 <span class="text-muted">(可选)</span></label>
            <div class="upload-area" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="handleDrop" :class="{'drag-over': dragOver}" @dragenter="dragOver=true" @dragleave="dragOver=false">
                <div v-if="!coverPreview && !coverUrl">
                    <div class="upload-icon">📷</div>
                    <p style="color:var(--text-secondary)">点击或拖拽上传封面图</p>
                </div>
                <img v-if="coverPreview" class="upload-preview" :src="coverPreview" alt="封面预览">
                <p v-if="coverPreview" class="text-sm text-muted mt-1">点击更换图片</p>
            </div>
            <input type="file" ref="fileInput" hidden accept="image/*" @change="handleFileSelect">
        </div>

        <!-- Title -->
        <div class="form-group">
            <label class="form-label" for="title">标题</label>
            <input type="text" id="title" class="form-input" v-model="form.title" style="font-size:1.2rem;font-weight:600" placeholder="输入文章标题..." required>
        </div>

        <!-- Summary -->
        <div class="form-group">
            <label class="form-label" for="summary">摘要 <span class="text-muted">(可选)</span></label>
            <input type="text" id="summary" class="form-input" v-model="form.summary" placeholder="简要描述文章内容...">
        </div>

        <!-- Category & Status -->
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div class="form-group" style="flex:1;min-width:200px">
                <label class="form-label" for="categoryId">分类</label>
                <select id="categoryId" class="form-input" v-model="form.categoryId">
                    <option value="">选择分类...</option>
                    <option v-for="cat in categories" :value="cat.id">{{ cat.name }}</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;min-width:200px">
                <label class="form-label" for="status">状态</label>
                <select id="status" class="form-input" v-model="form.status">
                    <option :value="1">📢 发布</option>
                    <option :value="0">📝 保存为草稿</option>
                </select>
            </div>
        </div>

        <!-- Tags -->
        <div class="form-group">
            <label class="form-label">标签 <span class="text-muted">(逗号分隔)</span></label>
            <input type="text" class="form-input" v-model="form.tags" placeholder="例如: Java, Spring Boot, 后端开发">
        </div>

        <!-- Editor -->
        <div class="form-group">
            <label class="form-label">内容 <span class="text-muted">(支持 Markdown)</span></label>
            <div class="editor-layout">
                <div class="editor-pane">
                    <textarea class="form-input" v-model="form.content" placeholder="使用 Markdown 格式写作..." style="min-height:450px" @input="updatePreview"></textarea>
                </div>
                <div class="preview-pane">
                    <h3 style="margin-bottom:12px;font-size:0.9rem;color:var(--text-muted)">📄 实时预览</h3>
                    <div class="article-content" v-html="previewHtml"></div>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div v-if="errorMsg" class="mb-2" style="color:var(--color-error);font-size:0.9rem">{{ errorMsg }}</div>
        <div style="display:flex;gap:12px">
            <button type="submit" class="btn btn-primary btn-lg" :disabled="submitting">
                {{ submitting ? '发布中...' : '🚀 发布文章' }}
            </button>
            <a href="/" class="btn btn-secondary btn-lg">取消</a>
        </div>
    </form>
</main>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
marked.setOptions({ breaks: true, gfm: true });
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const form = ref({ title: '', content: '', summary: '', categoryId: '', status: 1, tags: '' });
        const categories = ref([]);
        const coverFile = ref(null);
        const coverPreview = ref('');
        const coverUrl = ref('');
        const dragOver = ref(false);
        const previewHtml = ref('');
        const errorMsg = ref('');
        const submitting = ref(false);

        const loadCategories = async () => {
            try {
                const res = await api.get('/api/category/list');
                if (res.code === 200) categories.value = res.data || [];
            } catch {}
        };

        const handleFileSelect = (e) => {
            const file = e.target.files[0];
            if (file) processFile(file);
        };

        const handleDrop = (e) => {
            dragOver.value = false;
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        };

        const processFile = (file) => {
            if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 'warning'); return; }
            coverFile.value = file;
            const reader = new FileReader();
            reader.onload = (e) => { coverPreview.value = e.target.result; };
            reader.readAsDataURL(file);
        };

        const uploadCover = async () => {
            if (!coverFile.value) return null;
            const formData = new FormData();
            formData.append('file', coverFile.value);
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/upload/image', {
                    method: 'POST',
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {},
                    body: formData
                });
                const data = await res.json();
                if (data.code === 200) return data.data.url;
            } catch {}
            return null;
        };

        const updatePreview = () => {
            if (form.value.content) {
                previewHtml.value = marked.parse(form.value.content);
            } else {
                previewHtml.value = '<p style="color:#94a3b8">在此输入内容后预览...</p>';
            }
        };

        const submitArticle = async () => {
            if (!form.value.title.trim() || !form.value.content.trim()) {
                errorMsg.value = '标题和内容不能为空';
                return;
            }
            submitting.value = true;
            errorMsg.value = '';
            try {
                let cover = '';
                if (coverFile.value) {
                    cover = await uploadCover() || '';
                }
                const body = {
                    title: form.value.title,
                    content: form.value.content,
                    summary: form.value.summary,
                    categoryId: form.value.categoryId ? parseInt(form.value.categoryId) : null,
                    status: form.value.status,
                    coverImage: cover
                };
                // Note: tags are stored but will need backend tag support to work fully
                const res = await api.post('/api/article/publish', body);
                if (res.code === 200) {
                    showToast('发布成功！', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    errorMsg.value = res.msg || '发布失败';
                }
            } catch { errorMsg.value = '网络错误'; }
            finally { submitting.value = false; }
        };

        onMounted(() => loadCategories());

        return {
            form, categories, coverPreview, coverUrl, dragOver, previewHtml,
            errorMsg, submitting,
            handleFileSelect, handleDrop, updatePreview, submitArticle
        };
    }
}).mount('#app');
</script>
</body>
</html>
