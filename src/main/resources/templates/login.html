<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 个人博客</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/common.js"></script>
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>👋 欢迎回来</h2>
    <p class="auth-subtitle">登录你的博客账号</p>

    <form id="loginForm" @submit.prevent="handleLogin">
        <div class="form-group">
            <label class="form-label" for="username">用户名</label>
            <input type="text" id="username" class="form-input" v-model="username" placeholder="输入用户名" required autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">密码</label>
            <input type="password" id="password" class="form-input" v-model="password" placeholder="输入密码" required autocomplete="current-password">
        </div>
        <div v-if="errorMsg" class="mb-2" style="color:var(--color-error);font-size:0.85rem;text-align:center">{{ errorMsg }}</div>
        <button type="submit" class="btn btn-primary btn-block" :disabled="submitting">
            {{ submitting ? '登录中...' : '登录' }}
        </button>
    </form>

    <div class="auth-footer">
        <a href="/register">还没有账号？立即注册 →</a>
    </div>
    <div class="auth-footer mt-1">
        <a href="/" style="color:var(--text-muted);font-size:0.85rem">← 返回首页</a>
        <a href="/user/profile" style="color:var(--text-muted);font-size:0.85rem;margin-left:14px">👤 个人主页</a>
    </div>
</div>

<footer class="footer" style="position:fixed;bottom:0;left:0;right:0;margin-top:0;padding:12px;border-top:1px solid var(--border-color);background:var(--bg-card)">
    <div class="footer-tech">Spring Boot 3 &middot; MyBatis-Plus &middot; Redis &middot; Vue 3 &middot; Docker</div>
</footer>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref } = Vue;
createApp({
    setup() {
        const username = ref('');
        const password = ref('');
        const errorMsg = ref('');
        const submitting = ref(false);

        const handleLogin = async () => {
            if (!username.value.trim() || !password.value.trim()) {
                errorMsg.value = '请输入用户名和密码';
                return;
            }
            submitting.value = true;
            errorMsg.value = '';
            try {
                const res = await api.post('/api/user/login', { username: username.value, password: password.value });
                if (res.code === 200) {
                    localStorage.setItem('token', res.data);
                    showToast('登录成功！', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 500);
                } else {
                    errorMsg.value = res.msg || '用户名或密码错误';
                }
            } catch {
                errorMsg.value = '网络错误，请稍后重试';
            } finally {
                submitting.value = false;
            }
        };

        return { username, password, errorMsg, submitting, handleLogin };
    }
}).mount('.auth-card');
</script>
</body>
</html>
