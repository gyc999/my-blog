<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 个人博客</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
    <script src="/js/common.js"></script>
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>🎉 创建账号</h2>
    <p class="auth-subtitle">加入我们，开始记录生�?/p>

    <form @submit.prevent="handleRegister">
        <div class="form-group">
            <label class="form-label" for="username">用户�?/label>
            <input type="text" id="username" class="form-input" v-model="username" placeholder="用户�? required autocomplete="username" minlength="3" maxlength="20">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">密码</label>
            <input type="password" id="password" class="form-input" v-model="password" placeholder="至少6位密�? required autocomplete="new-password" minlength="6" @input="checkPasswordStrength">
            <div class="password-strength" :class="passwordStrength" v-if="password"></div>
        </div>
        <div class="form-group">
            <label class="form-label" for="nickname">昵称 <span class="text-muted">(可�?</span></label>
            <input type="text" id="nickname" class="form-input" v-model="nickname" placeholder="如何称呼你？" maxlength="20">
        </div>
        <div v-if="errorMsg" class="mb-2" style="color:var(--color-error);font-size:0.85rem;text-align:center">{{ errorMsg }}</div>
        <div v-if="successMsg" class="mb-2" style="color:var(--color-success);font-size:0.85rem;text-align:center">{{ successMsg }}</div>
        <button type="submit" class="btn btn-primary btn-block" :disabled="submitting">
            {{ submitting ? '注册�?..' : '注册' }}
        </button>
    </form>

    <div class="auth-footer">
        <a href="/login">已有账号？立即登�?�?/a>
    </div>
    <div class="auth-footer mt-1">
        <a href="/" style="color:var(--text-muted);font-size:0.85rem">�?返回首页</a>
        <a href="/user/profile" style="color:var(--text-muted);font-size:0.85rem;margin-left:14px">👤 个人主页</a>
    </div>
</div>

<footer class="footer" style="position:fixed;bottom:0;left:0;right:0;margin-top:0;padding:12px;border-top:1px solid var(--border-color);background:var(--bg-card)">
    <div class="footer-tech">Spring Boot 3 &middot; MyBatis-Plus &middot; Redis &middot; Vue 3 &middot; Docker</div>
</footer>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref } = Vue;
createApp({
    setup() {
        const username = ref('');
        const password = ref('');
        const nickname = ref('');
        const errorMsg = ref('');
        const successMsg = ref('');
        const submitting = ref(false);
        const passwordStrength = ref('');

        const checkPasswordStrength = () => {
            const p = password.value;
            if (p.length < 4) passwordStrength.value = 'weak';
            else if (p.length < 8 && /[a-zA-Z]/.test(p) && /\d/.test(p)) passwordStrength.value = 'medium';
            else if (p.length >= 8 && /[a-zA-Z]/.test(p) && /\d/.test(p) && /[^a-zA-Z\d]/.test(p)) passwordStrength.value = 'strong';
            else if (p.length >= 6) passwordStrength.value = 'medium';
            else passwordStrength.value = 'weak';
        };

        const handleRegister = async () => {
            if (!username.value.trim() || !password.value.trim()) {
                errorMsg.value = '用户名和密码不能为空';
                return;
            }
            if (password.value.length < 6) {
                errorMsg.value = '密码至少需�?�?;
                return;
            }
            submitting.value = true;
            errorMsg.value = '';
            successMsg.value = '';
            try {
                const res = await api.post('/api/user/register', {
                    username: username.value.trim(),
                    password: password.value,
                    nickname: nickname.value.trim() || username.value.trim()
                });
                if (res.code === 200) {
                    successMsg.value = '注册成功！即将跳�?..';
                    showToast('注册成功�?, 'success');
                    setTimeout(() => { window.location.href = '/login'; }, 1000);
                } else {
                    errorMsg.value = res.msg || '注册失败';
                }
            } catch {
                errorMsg.value = '网络错误，请稍后重试';
            } finally {
                submitting.value = false;
            }
        };

        return { username, password, nickname, errorMsg, successMsg, submitting, passwordStrength, handleRegister, checkPasswordStrength };
    }
}).mount('.auth-card');
</script>
</body>
</html>
