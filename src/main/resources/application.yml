spring:
  datasource:
    url: jdbc:${MYSQL_URL:mysql://root:root@localhost:3306/blog}?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=%2B08:00
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Shanghai

  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}
      password: ${REDISPASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gyc.blog.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:myBlogSecretKey1234567890123456789012}
    expire: 86400000
  upload:
    path: uploads
  ai:
    provider: ${AI_PROVIDER:deepseek}           # anthropic / openai / deepseek
    api-key: ${AI_API_KEY:}                      # API Key，Railway 环境变量注入
    model: ${AI_MODEL:deepseek-chat}              # deepseek-chat / gpt-4o-mini / claude-haiku
    summary-max-chars: 150                        # 摘要最大字数
    enabled: ${AI_ENABLED:true}                   # 是否启用 AI 摘要
